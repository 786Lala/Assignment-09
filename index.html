<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 09 - Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #eeeeee;
            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            max-width: 520px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 8px solid #f5f5f5;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
        }

        .hello {
            font-size: 30px;
            font-weight: bold;
            padding: 6px;
            margin-bottom: 22px;
        }

        .first {
            color: #142d35;
            background-color: #a9dce8;
            border: 7px double #e45b4f;
        }

        .second {
            color: #292300;
            background-color: #fff000;
            border: 4px solid #168bd0;
            border-radius: 14px;
        }

        .third {
            color: #073c20;
            background-color: #24c875;
            border: 4px solid #36bd79;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hello first">Hello World</div>
        <div class="hello second">Hello World</div>
        <div class="hello third">Hello World</div>
    </div>
</body>
</html>
